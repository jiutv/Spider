name: Spider Jar Gen CI

on:
  push:
    branches: [ "multiThread" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ===== 修复：确保 tess-two aar 文件完整 =====
      - name: Download tess-two aar
        run: |
          curl -L -o app/libs/tess-two-9.1.0.aar             "https://github.com/jiutv/Spider/raw/multiThread/app/libs/tess-two-9.1.0.aar"
          ls -lh app/libs/tess-two-9.1.0.aar
          file app/libs/tess-two-9.1.0.aar

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'jetbrains'
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Clean & Build with Gradle
        run: |
          ./gradlew clean
          ./gradlew app:buildCustomSpiderJar --refresh-dependencies

      - name: Add & Commit
        uses: EndBug/add-and-commit@v9.1.4
        with:
          default_author: github_actions
          message: 'update spider jar and json'
          add: "['./jar/custom_spider.jar', './jar/custom_spider.jar.md5','./json/index.json']"
