name: Spider Jar Gen CI

on:
  push:
    branches: [ "multiThread" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ===== 方案 A：验证并安装到本地 Maven 仓库 =====
      - name: Setup local Maven repository for tess-two
        run: |
          echo "=== 检查 checkout 下来的 aar ==="
          ls -lh app/libs/tess-two-9.1.0.aar || echo "文件不存在"
          file app/libs/tess-two-9.1.0.aar || true

          echo "=== 重新下载 aar ==="
          curl -L -o /tmp/tess-two-9.1.0.aar             "https://github.com/jiutv/Spider/raw/multiThread/app/libs/tess-two-9.1.0.aar"

          echo "=== 验证下载的 aar ==="
          ls -lh /tmp/tess-two-9.1.0.aar
          file /tmp/tess-two-9.1.0.aar

          echo "=== 检查文件头 ==="
          head -c 4 /tmp/tess-two-9.1.0.aar | xxd || true

          echo "=== 复制到项目目录 ==="
          cp /tmp/tess-two-9.1.0.aar app/libs/tess-two-9.1.0.aar

          echo "=== 安装到本地 Maven 仓库 ==="
          mkdir -p ~/.m2/repository/com/rmtheis/tess-two/9.1.0
          cp /tmp/tess-two-9.1.0.aar ~/.m2/repository/com/rmtheis/tess-two/9.1.0/tess-two-9.1.0.aar
          cat > ~/.m2/repository/com/rmtheis/tess-two/9.1.0/tess-two-9.1.0.pom << 'POMEOF'
<?xml version="1.0" encoding="UTF-8"?>
<project xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd" xmlns="http://maven.apache.org/POM/4.0.0"
    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <modelVersion>4.0.0</modelVersion>
  <groupId>com.rmtheis</groupId>
  <artifactId>tess-two</artifactId>
  <version>9.1.0</version>
  <packaging>aar</packaging>
</project>
POMEOF

          echo "=== 本地 Maven 仓库内容 ==="
          ls -lh ~/.m2/repository/com/rmtheis/tess-two/9.1.0/

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'jetbrains'
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Clean & Build with Gradle
        run: |
          ./gradlew clean
          ./gradlew app:buildCustomSpiderJar --refresh-dependencies --info

      - name: Add & Commit
        uses: EndBug/add-and-commit@v9.1.4
        with:
          default_author: github_actions
          message: 'update spider jar and json'
          add: "['./jar/custom_spider.jar', './jar/custom_spider.jar.md5','./json/index.json']"
