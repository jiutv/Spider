name: Spider Jar Gen CI

on:
  push:
    branches: [ "multiThread" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'jetbrains'
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew app:buildCustomSpiderJar


      - name: Add & Commit
        uses: EndBug/add-and-commit@v9.1.4
        with:
          default_author: github_actions
          message: 'update spider jar and json'
          add: "['./jar/custom_spider.jar', './jar/custom_spider.jar.md5','./json/index.json']"

      - name: upload json
        uses: airvzxf/ftp-deployment-action@latest
        with:
            # FTP Server.
            server: ftpupload.net
            # FTP User.
            user: mseet_40633048
            # FTP Password.
            password: DL0NzRdjf1Wv
            # Local directory.
            local_dir: ${{ github.workspace }}/json/index.json
            # Remote directory.
            remote_dir: htdocs/json/

      - name: upload jar
        uses: airvzxf/ftp-deployment-action@latest
        with:
          # FTP Server.
          server: ftpupload.net
          # FTP User.
          user: mseet_40633048
          # FTP Password.
          password: DL0NzRdjf1Wv
          # Local directory.
          local_dir: ${{ github.workspace }}/jar/custom_spider.jar
          # Remote directory.
          remote_dir: htdocs/jar/

