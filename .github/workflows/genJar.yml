name: Spider Jar Gen CI

on:
  push:
    branches: [ "multiThread" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ===== 修复：下载 aar 并安装到本地 Maven 仓库 =====
      - name: Setup local Maven repository for tess-two
        run: |
          mkdir -p ~/.m2/repository/com/rmtheis/tess-two/9.1.0
          curl -L -o ~/.m2/repository/com/rmtheis/tess-two/9.1.0/tess-two-9.1.0.aar             "https://github.com/jiutv/Spider/raw/multiThread/app/libs/tess-two-9.1.0.aar"
          cat > ~/.m2/repository/com/rmtheis/tess-two/9.1.0/tess-two-9.1.0.pom << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project>
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.rmtheis</groupId>
            <artifactId>tess-two</artifactId>
            <version>9.1.0</version>
            <packaging>aar</packaging>
          </project>
          EOF
          ls -lh ~/.m2/repository/com/rmtheis/tess-two/9.1.0/

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'jetbrains'
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Clean & Build with Gradle
        run: |
          ./gradlew clean
          ./gradlew app:buildCustomSpiderJar --refresh-dependencies

      - name: Add & Commit
        uses: EndBug/add-and-commit@v9.1.4
        with:
          default_author: github_actions
          message: 'update spider jar and json'
          add: "['./jar/custom_spider.jar', './jar/custom_spider.jar.md5','./json/index.json']"
